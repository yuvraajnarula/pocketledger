worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log debug;  # ← Debug logging

events { worker_connections 1024; }

http {
    default_type application/json;
    access_log /var/log/nginx/access.log;

    map $http_origin $cors_origin {
        default                        "";
        "http://localhost:5173"         "$http_origin";
    }

    # --- Global proxy settings (applies to all locations) ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- mTLS settings for upstream connections (MUST be in http/server/location) ---
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify off;  # ← Keep off for debugging; set to 'on' after certs verified
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_certificate /certs/nginx-client.crt;
    proxy_ssl_certificate_key /certs/nginx-client.key;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse on;

    # --- Simple upstream definitions (NO ssl directives here) ---
    upstream wallet_svc {
        server wallet-svc:8081;
    }
    upstream ledger_svc {
        server ledger-svc:8082;
    }

    server {
        listen 80;

        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Idempotency-Key" always;
        if ($request_method = OPTIONS) { return 204; }

        # --- Routes: use https:// to trigger TLS to upstream ---
        location = /health {
            proxy_pass https://wallet_svc/health;
        }
        location = /metrics {
            proxy_pass https://ledger_svc/metrics;
        }
        location = /reconcile {
            proxy_pass https://ledger_svc/reconcile;
        }
        location /admin/ {
            proxy_pass https://ledger_svc;
        }
        location /webhooks/ {
            proxy_pass https://ledger_svc;
        }
        location ~ ^/wallets/[^/]+/transfer/fx$ {
            proxy_pass https://ledger_svc;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }
        location ~ ^/wallets/[^/]+/transfer$ {
            proxy_pass https://ledger_svc;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }
        location /idempotency/ {
            proxy_pass https://ledger_svc;
        }
        location ~ ^/wallets/[^/]+/balance-at$ {
            proxy_pass https://ledger_svc;
        }
        location /wallets/ {
            proxy_pass https://wallet_svc;
        }
        location ~ ^/wallets/[^/]+$ {
            proxy_pass https://wallet_svc;
        }
        location = /wallets {
            proxy_pass https://wallet_svc;
        }
        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}